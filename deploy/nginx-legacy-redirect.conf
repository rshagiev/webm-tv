# Preserve old bookmarks after switching to the shorter public hostname.
server {
    listen 80;
    server_name webmtv.176-32-32-125.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://webmtv.b020207d.sslip.io$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name webmtv.176-32-32-125.sslip.io;
    ssl_certificate /etc/letsencrypt/live/webmtv.176-32-32-125.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webmtv.176-32-32-125.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://webmtv.b020207d.sslip.io$request_uri;
}
