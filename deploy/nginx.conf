# Substitute DOMAIN before installing as /etc/nginx/conf.d/webmtv.conf.
limit_req_zone $binary_remote_addr zone=webmtv_ip:5m rate=5r/s;
limit_req_zone $server_name zone=webmtv_total:1m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=webmtv_connections:5m;
limit_conn_zone $server_name zone=webmtv_all_connections:1m;
proxy_cache_path /var/cache/nginx/webmtv levels=1:2 keys_zone=webmtv:8m max_size=64m inactive=10m;
server {
    listen 80;
    server_name DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://DOMAIN$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name DOMAIN;
    if ($host != DOMAIN) { return 444; }
    ssl_certificate /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:webmtv_tls:5m;
    ssl_session_timeout 1d;
    server_tokens off;
    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 20s;
    keepalive_requests 100;
    limit_conn webmtv_connections 16;
    limit_conn webmtv_all_connections 160;
    limit_conn_status 429;
    limit_req_status 429;
    add_header X-WebMTV-Cache $upstream_cache_status always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    access_log off;
    error_log /var/log/nginx/webmtv-error.log warn;
    root /srv/webmtv/current/dist;
    location ^~ /assets/ {
        limit_req zone=webmtv_ip burst=30 nodelay;
        expires 1y;
        try_files $uri =404;
    }
    error_page 429 = @limited;
    location @limited {
        default_type application/json;
        add_header Retry-After 3 always;
        return 429 '{"error":"Слишком много запросов. Подождите несколько секунд."}';
    }
    # Media is streamed, never buffered to nginx temporary files or cached.
    location ^~ /api/media/ {
        limit_req zone=webmtv_ip burst=15 nodelay;
        limit_req zone=webmtv_total burst=40 nodelay;
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host DOMAIN;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
    location /api/ {
        limit_req zone=webmtv_ip burst=15 nodelay;
        limit_req zone=webmtv_total burst=40 nodelay;
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host DOMAIN;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_cache webmtv;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$request_method$request_uri";
        proxy_cache_valid 200 5s;
        proxy_cache_lock on;
        proxy_cache_revalidate on;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_502 http_503 http_504;
        proxy_no_cache $http_origin;
        proxy_cache_bypass $http_origin;
    }
    location = /api/health {
        limit_req zone=webmtv_ip burst=5 nodelay;
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host DOMAIN;
        proxy_read_timeout 5s;
        add_header Cache-Control no-store;
    }
    # Shared pages need server-rendered metadata for Telegram and other crawlers.
    location ^~ /watch/ {
        limit_req zone=webmtv_ip burst=20 nodelay;
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host DOMAIN;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location / {
        limit_req zone=webmtv_ip burst=20 nodelay;
        try_files $uri /index.html;
    }
}
