name: Public site availability
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check HTTPS and API
        run: |
          curl --fail --retry 2 --retry-delay 10 --max-time 20 https://webmtv.b020207d.sslip.io/api/health | python3 -c 'import sys,json; h=json.load(sys.stdin); assert h["ok"] and h["public"]'
          curl --fail --retry 2 --max-time 20 https://webmtv.b020207d.sslip.io/ -o /tmp/index.html
          grep -q 'WebM TV' /tmp/index.html
